name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; queue up new ones, cancel in-progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        env:
          # Project-page base path — `${{ github.event.repository.name }}` gives
          # the repo name, so this works without hand-editing the config.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Optional: add a VITE_MAPBOX_TOKEN repo secret to enable the Traverse
          # tool's map, search and routed modes in production. If unset, Traverse
          # still works in Direct (straight-line) mode. Mapbox `pk.` tokens are
          # public client-side tokens, so embedding it in the build is expected.
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
        run: npm run build

      # Pages must be enabled once via Settings → Pages → Source: GitHub
      # Actions. The default GITHUB_TOKEN can deploy to Pages but lacks the
      # admin scope to create the Pages site, so `enablement: true` can't
      # do this for us.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
